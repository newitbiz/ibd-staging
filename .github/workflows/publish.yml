name: publish-ghcr
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  packages: write
  contents: read
jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: backend
            image: ibd-staging-api
            alt: ibd-staging/api
          - context: web
            image: ibd-staging-web
            alt: ibd-staging/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/newitbiz/${{ matrix.image }}:66e7d07
            ghcr.io/newitbiz/${{ matrix.alt }}:66e7d07
            ghcr.io/${{ github.repository }}/${{ matrix.context }}:66e7d07
      - name: Ensure public visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for p in "${{ matrix.image }}" "${{ matrix.alt }}"; do
            enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$p")
            echo "Trying visibility for $p ($enc)"
            gh api --method POST "/user/packages/container/${enc}/visibility" -f visibility=public || true
            gh api --method PATCH "/user/packages/container/${enc}" -f visibility=public || true
            gh api "/user/packages/container/${enc}" --jq '{name,visibility}' || true
          done
