name: publish-ghcr
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  packages: write
  contents: read
jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: backend
            name: api
          - context: web
            name: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:8f7e8d1
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
      - name: Ensure public visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          enc=$(python3 -c "import urllib.parse; print(urllib.parse.quote('ibd-staging/${{ matrix.name }}', safe=''))")
          gh api --method POST "/user/packages/container/${enc}/visibility" -f visibility=public || true
          gh api --method PATCH "/user/packages/container/${enc}" -f visibility=public || true
          gh api "/user/packages/container/${enc}" --jq '{name,visibility}' || true
