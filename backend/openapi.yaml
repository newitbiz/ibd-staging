openapi: 3.1.0
info:
  title: Invest in Bd API
  version: 0.15.0
  description: MVP contract including Investor pack (home, Approved referral reward payout requests, apply-to-shares, support messages, KYC change reason), Super Admin pack, and Project Owner pack. Integer poisha + bps. Staging only. fundsMoved:false. No wallet language.
servers:
  - url: https://api.example.invalid/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200':
          description: Service health
  /auth/register:
    post:
      security: []
      summary: Register a new user (investor or project owner)
      responses:
        '201':
          description: Pending verification user created and OTP issued
  /auth/login:
    post:
      security: []
      summary: Login with email/mobile and password
      responses:
        '200':
          description: Access and refresh tokens, or OTP challenge for pending users
  /auth/otp/verify:
    post:
      security: []
      summary: Verify an OTP challenge
      responses:
        '200':
          description: OTP accepted; session or reset token issued
  /auth/token/refresh:
    post:
      security: []
      summary: Rotate refresh token and issue a new access token
      responses:
        '200':
          description: Rotated tokens
  /auth/logout:
    post:
      summary: Revoke refresh token / active sessions
      responses:
        '200':
          description: Logged out
  /auth/password/forgot:
    post:
      security: []
      summary: Request password reset OTP
      responses:
        '200':
          description: Generic acceptance response
  /auth/password/reset:
    post:
      security: []
      summary: Reset password with a one-time reset token
      responses:
        '200':
          description: Password updated and sessions revoked
  /auth/me:
    get:
      summary: Current authenticated user
      responses:
        '200':
          description: User profile and roles
  /auth/sessions/revoke:
    post:
      summary: Revoke all sessions for a user
      x-roles: [super_admin, support]
      responses:
        '200':
          description: Sessions revoked
  /categories:
    get:
      security: []
      summary: List active project categories for browse filters and owner create
      responses:
        '200':
          description: Active categories ordered by displayOrder
  /admin/categories:
    get:
      summary: List all categories including inactive
      x-roles: [super_admin, project_reviewer]
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Admin category list
    post:
      summary: Create a project category
      x-roles: [super_admin, project_reviewer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Category created
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/categories/reorder:
    post:
      summary: Reorder all categories by full ordered id list
      x-roles: [super_admin, project_reviewer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderedIds]
              properties:
                orderedIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Categories reordered
  /admin/categories/{categoryId}:
    post:
      summary: Update category fields (name, slug, description, iconUrl, displayOrder)
      x-roles: [super_admin, project_reviewer]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Category updated
        '404':
          description: Category not found
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/categories/{categoryId}/activate:
    post:
      summary: Activate a category
      x-roles: [super_admin, project_reviewer]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category activated
  /admin/categories/{categoryId}/deactivate:
    post:
      summary: Deactivate a category (hidden from owner create / public list)
      x-roles: [super_admin, project_reviewer]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category deactivated
  /me/profile:
    get:
      summary: Get authenticated investor profile (completion + KYC + verification flags)
      x-roles: [investor]
      responses:
        '200':
          description: Investor profile
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (non-investor)
    patch:
      summary: Update authenticated investor profile fields
      x-roles: [investor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestorProfilePatch'
      responses:
        '200':
          description: Updated profile
        '400':
          description: Validation error
  /me/bank:
    get:
      summary: Get masked bank details for authenticated investor
      x-roles: [investor]
      responses:
        '200':
          description: Masked bank details (last4 only) or null
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    put:
      summary: Create or replace investor bank / optional MFS details (encrypted at rest)
      x-roles: [investor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestorBankUpsert'
      responses:
        '200':
          description: Masked bank details; verificationStatus pending (resets if previously verified)
        '400':
          description: Validation error
  /admin/investors/{investorId}/bank:
    get:
      summary: Finance/admin view of masked investor bank details
      x-roles: [super_admin, finance_officer]
      parameters:
        - $ref: '#/components/parameters/InvestorId'
      responses:
        '200':
          description: Masked bank details
        '403':
          description: Forbidden (including project_owner)
  /admin/investors/{investorId}/bank/verify:
    post:
      summary: Set bank verification status (verified/rejected/pending)
      x-roles: [super_admin, finance_officer]
      parameters:
        - $ref: '#/components/parameters/InvestorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [verified, rejected, pending] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Updated masked bank details
        '403':
          description: Forbidden (including project_owner)
  /admin/investors/{investorId}/kyc:
    post:
      summary: Update investor KYC status
      x-roles: [super_admin, compliance_reviewer]
      parameters:
        - $ref: '#/components/parameters/InvestorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [not_started, pending, approved, rejected] }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Updated profile
  /projects:
    get:
      security: []
      summary: List published (marketplace-visible) projects only
      parameters:
        - name: category
          in: query
          schema: { type: string }
          description: Optional category slug filter
        - name: termMinDays
          in: query
          schema: { type: integer, minimum: 1 }
        - name: termMaxDays
          in: query
          schema: { type: integer, minimum: 1 }
        - name: unitPriceMinPoisha
          in: query
          schema: { type: integer, minimum: 1 }
        - name: unitPriceMaxPoisha
          in: query
          schema: { type: integer, minimum: 1 }
        - name: status
          in: query
          schema: { type: string }
          description: Marketplace status filter (published,paused,funding_closed,active) comma-separated
      responses:
        '200':
          description: Published / paused / funding_closed / active projects
    post:
      summary: Create a project draft (legacy alias of POST /owner/projects)
      x-roles: [project_owner]
      responses:
        '201':
          description: Draft created
  /projects/{slug}:
    get:
      security: []
      summary: Get a published project by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Published project detail with financial terms + projected-return disclaimer
        '404':
          description: Not found or not publicly visible
  /projects/{projectId}/investment-preview:
    get:
      security: []
      summary: Preview investment amounts for N units (integer poisha + bps)
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: units
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Calculation preview with projected-return disclaimer
        '409':
          $ref: '#/components/responses/Conflict'
  /investments/preview:
    post:
      security: []
      summary: Preview investment calculation (by projectId or raw unit/fee inputs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId: { type: string, format: uuid }
                units: { type: integer, minimum: 1 }
                unitInvestmentPoisha: { type: integer, minimum: 1 }
                administrationFeeBps: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Calculation preview
  /owner/projects:
    get:
      summary: List projects owned by the authenticated owner
      x-roles: [project_owner]
      responses:
        '200':
          description: Owner projects
    post:
      summary: Create an owner project draft (incomplete drafts allowed)
      x-roles: [project_owner]
      responses:
        '201':
          description: Draft created
  /owner/projects/{projectId}:
    get:
      summary: Get own project
      x-roles: [project_owner]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project detail
    patch:
      summary: Edit own draft or changes_requested project
      x-roles: [project_owner]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Updated project
        '403':
          description: Forbidden field or not owner
        '409':
          description: Not editable in current status
  /owner/projects/{projectId}/submit:
    post:
      summary: Submit draft for review
      x-roles: [project_owner]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: submitted_for_review
        '409':
          $ref: '#/components/responses/Conflict'
  /owner/projects/{projectId}/resubmit:
    post:
      summary: Resubmit after changes_requested
      x-roles: [project_owner]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: resubmitted
  /owner/projects/{projectId}/versions:
    get:
      summary: Version history for own project
      x-roles: [project_owner]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Version snapshots
  /admin/projects:
    get:
      summary: List all projects or review queue
      x-roles: [super_admin, project_reviewer]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: reviewQueue
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Admin project list
    post:
      summary: Admin create unpublished project
      x-roles: [super_admin, project_reviewer]
      responses:
        '201':
          description: Draft created
  /admin/projects/{projectId}:
    get:
      summary: Admin get project
      x-roles: [super_admin, project_reviewer]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project detail
    patch:
      summary: Admin edit unpublished project
      x-roles: [super_admin, project_reviewer]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Updated
  /admin/projects/{projectId}/request-changes:
    post:
      summary: Request changes (mandatory reason)
      x-roles: [super_admin, project_reviewer]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: changes_requested
  /admin/projects/{projectId}/reject:
    post:
      summary: Reject project (mandatory reason)
      x-roles: [super_admin, project_reviewer]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: rejected
  /admin/projects/{projectId}/approve:
    post:
      summary: Approve project (requires complete risk/terms/exit)
      x-roles: [super_admin, project_reviewer]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: approved
  /admin/projects/{projectId}/publish:
    post:
      summary: Publish an approved project (separate from approve)
      x-roles: [super_admin, project_reviewer]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project published
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/projects/{projectId}/pause:
    post:
      summary: Pause funding on a published project
      x-roles: [super_admin, project_reviewer]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: paused
  /admin/projects/{projectId}/close-funding:
    post:
      summary: Close funding
      x-roles: [super_admin, project_reviewer]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: funding_closed
  /admin/projects/{projectId}/versions:
    get:
      summary: Admin version history / audit snapshots
      x-roles: [super_admin, project_reviewer, auditor]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Version snapshots
  /applications:
    post:
      summary: Apply for units in a published project (accepts terms version)
      x-roles: [investor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, units, acceptedTermsVersion]
              properties:
                projectId: { type: string, format: uuid }
                units: { type: integer, minimum: 1 }
                acceptedTermsVersion: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Application submitted (linked to project terms version + project version number)
        '409':
          $ref: '#/components/responses/Conflict'
  /applications/mine:
    get:
      summary: List the authenticated investor's applications
      x-roles: [investor]
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Investor applications
  /applications/mine/{applicationId}:
    get:
      summary: Get own application detail
      x-roles: [investor]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application detail
        '403':
          description: Not the application owner
  /applications/{applicationId}/resubmit:
    post:
      summary: Resubmit after changes_requested
      x-roles: [investor]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                units: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Resubmitted
        '409':
          $ref: '#/components/responses/Conflict'
  /applications/{applicationId}/cancel:
    post:
      summary: Cancel own application before payment reservation
      x-roles: [investor]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Cancelled
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/applications/{applicationId}/approve:
    post:
      summary: Approve an application and reserve units
      x-roles: [super_admin, compliance_reviewer]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application approved for payment (approved_payment_pending)
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/applications/{applicationId}/reject:
    post:
      summary: Reject an application with reason
      x-roles: [super_admin, compliance_reviewer]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200':
          description: Rejected
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/applications/{applicationId}/request-changes:
    post:
      summary: Request changes on an application with reason
      x-roles: [super_admin, compliance_reviewer]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200':
          description: Changes requested
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/applications/{applicationId}/start-review:
    post:
      summary: Mark application under_review
      x-roles: [super_admin, compliance_reviewer]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Under review
  /admin/applications/{applicationId}:
    get:
      summary: Get application detail for staff review
      x-roles: [super_admin, compliance_reviewer]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Application detail
  /payments:
    post:
      summary: Submit a payment or manual-payment evidence
      x-roles: [investor]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentSubmission'
      responses:
        '201':
          description: Payment awaiting verification
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/payments:
    get:
      summary: List payments for finance review queues
      x-roles: [super_admin, finance_officer]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [verification_pending, verified, rejected], default: verification_pending }
      responses:
        '200':
          description: Payment review queue
  /admin/payments/{paymentId}/reject:
    post:
      summary: Reject a pending manual payment and release reserved units
      x-roles: [super_admin, finance_officer]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewNote]
              properties:
                reviewNote: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200':
          description: Payment rejected
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/applications:
    get:
      summary: List applications for compliance review (default review queue)
      x-roles: [super_admin, compliance_reviewer]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, under_review, changes_requested, approved_payment_pending, rejected, expired, cancelled, payment_verification_pending, active, payment_rejected]
      responses:
        '200':
          description: Application review queue
  /owner/projects:
    get:
      summary: List projects owned by the authenticated project owner
      x-roles: [project_owner]
      responses:
        '200':
          description: Owner projects with funded unit totals
  /investments:
    get:
      summary: List allocation/investment cards for the authenticated investor
      x-roles: [investor, super_admin, finance_officer, auditor]
      parameters:
        - name: investorId
          in: query
          schema: { type: string, format: uuid }
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Investment allocations from PostgreSQL
  /admin/payments/{paymentId}/verify:
    post:
      summary: Verify payment and atomically allocate units
      x-roles: [super_admin, finance_officer]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewNote]
              properties:
                reviewNote: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200':
          description: Payment verified and allocation activated
        '409':
          $ref: '#/components/responses/Conflict'
  /investments/{allocationId}:
    get:
      summary: Get share holding detail with projected return vs Approved distributions
      x-roles: [investor, super_admin, finance_officer, auditor]
      parameters:
        - name: allocationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Share holding detail. Fields include projectedAccruedReturnPoisha (non-guaranteed),
            estimateLabel, projectionDisclaimer, confirmedProfitPoisha / approvedDistributions,
            dailyProjectedReturnPoisha (= round(investment_poisha × annual_bps / 365 / 10000)),
            withdrawable:false. Projections never become payable.
  /investments/{allocationId}/exit-eligibility:
    get:
      summary: Check early-exit eligibility for a share holding
      x-roles: [investor, super_admin, finance_officer, auditor]
      parameters:
        - name: allocationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: |
            Eligibility including min hold days (default 180), elapsed days, estimated payable
            (display only). Liquidity is not guaranteed. Own-only for investors.
  /investments/{allocationId}/exit-requests:
    get:
      summary: List exit requests for a share holding
      x-roles: [investor, super_admin, finance_officer, auditor]
      parameters:
        - name: allocationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Exit requests for the allocation (own-only for investors)
    post:
      summary: Submit an early-exit request
      description: |
        Investor submits exit for own allocation only after minimum holding period
        (project minimum_exit_days or default 180). Liquidity is not guaranteed.
        Sets allocation status to exit_requested. Does not move funds.
      x-roles: [investor]
      parameters:
        - name: allocationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2000 }
                deductionPoisha: { type: integer, minimum: 0, description: Optional estimate deduction in poisha }
      responses:
        '201':
          description: Exit request submitted without liquidity guarantee
        '403':
          description: Not owner of allocation
        '409':
          description: Hold period not met, allocation ineligible, or open exit already exists
  /exit-requests:
    get:
      summary: List exit requests (investor own / staff any)
      x-roles: [investor, super_admin, finance_officer, auditor]
      parameters:
        - name: allocationId
          in: query
          schema: { type: string, format: uuid }
        - name: investorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Exit request list
  /exit-requests/{exitRequestId}:
    get:
      summary: Get one exit request
      x-roles: [investor, super_admin, finance_officer, auditor]
      parameters:
        - name: exitRequestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Exit request detail (may include display-only Exit payment)
        '403':
          description: Not owner
  /exit-requests/{exitRequestId}/cancel:
    post:
      summary: Cancel own exit request before decision
      x-roles: [investor]
      parameters:
        - name: exitRequestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cancelled; allocation may return to active
        '409':
          description: Not cancelable in current status
  /admin/exit-requests:
    get:
      summary: Admin/finance exit request review queue
      x-roles: [super_admin, finance_officer]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [submitted, under_review, approved_waiting_liquidity, approved, rejected, completed, cancelled, all]
      responses:
