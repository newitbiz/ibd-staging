components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvestorId:
      name: investorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 100 }
  schemas:
    InvestorProfilePatch:
      type: object
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, minLength: 8, maxLength: 20 }
        dateOfBirth: { type: string, format: date }
        nationality: { type: string, minLength: 2, maxLength: 80 }
        occupation: { type: string, minLength: 2, maxLength: 120 }
        presentAddress: { type: string, minLength: 5, maxLength: 500 }
        permanentAddress: { type: string, minLength: 5, maxLength: 500 }
        nomineeName: { type: string, minLength: 2, maxLength: 120 }
        nomineeRelationship: { type: string, minLength: 2, maxLength: 80 }
        nomineePhone: { type: string, minLength: 8, maxLength: 20 }
    InvestorBankUpsert:
      type: object
      required: [accountHolderName, bankName, branchName, accountType, accountNumber, routingNumber]
      properties:
        accountHolderName: { type: string, minLength: 2, maxLength: 120 }
        bankName: { type: string, minLength: 2, maxLength: 120 }
        branchName: { type: string, minLength: 2, maxLength: 120 }
        accountType: { type: string, enum: [savings, current, other] }
        accountNumber: { type: string, pattern: '^[0-9]{8,20}$' }
        routingNumber: { type: string, pattern: '^[0-9A-Za-z]{4,20}$' }
        mfsType: { type: string, enum: [bkash, nagad, rocket, upay, other], nullable: true }
        mfsNumber: { type: string, pattern: '^[0-9]{8,15}$', nullable: true }
    CategoryCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, maxLength: 500, nullable: true }
        iconUrl: { type: string, maxLength: 500, nullable: true }
        displayOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean, default: true }
    CategoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        description: { type: string, maxLength: 500, nullable: true }
        iconUrl: { type: string, maxLength: 500, nullable: true }
        displayOrder: { type: integer, minimum: 0 }
    PaymentSubmission:
      type: object
      required: [applicationId, method, amountPoisha, reference]
      properties:
        applicationId: { type: string, format: uuid }
        method: { type: string, enum: [cash, bank_transfer, bkash, sslcommerz] }
        amountPoisha: { type: integer, minimum: 1 }
        reference: { type: string, minLength: 3, maxLength: 100 }
        evidenceId: { type: string, format: uuid }
  responses:
    Conflict:
      description: Current state or inventory conflicts with the request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }


