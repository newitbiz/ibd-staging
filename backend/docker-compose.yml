services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grow_bangladesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: LocalTestPassword123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - grow_bangladesh_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grow_bangladesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:LocalTestPassword123@postgres:5432/grow_bangladesh
      DATABASE_SSL: "false"
      JWT_SECRET: local-compose-only-grow-bangladesh-jwt-secret-32
      JWT_ACCESS_TTL_SECONDS: "900"
      JWT_REFRESH_TTL_DAYS: "30"
      ALLOW_DEV_USER_HEADER: "true"
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-LocalDemoSeedPass123!}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "node scripts/migrate.js && node scripts/seed.js && node src/server.js"]

volumes:
  grow_bangladesh_postgres:
